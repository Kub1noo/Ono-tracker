- name: Uložení nových cen do repozitáře
        run: |
          if [ -f prices.json ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add prices.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace cen" && git push)
          fi
